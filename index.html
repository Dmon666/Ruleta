<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruleta Compartida</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f3f4f6;
            touch-action: manipulation;
        }
        
        #roulette-canvas {
            width: 100%;
            max-width: 400px;
            aspect-ratio: 1;
            margin: 0 auto;
            display: block;
            touch-action: none; 
            cursor: pointer;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.1));
            transition: transform 0.2s;
        }
        
        #roulette-canvas:active {
            transform: scale(0.98);
        }

        .toast-enter {
            transform: translateY(100%);
            opacity: 0;
        }
        .toast-enter-active {
            transform: translateY(0);
            opacity: 1;
            transition: all 300ms ease-out;
        }
        .toast-exit {
            transform: translateY(0);
            opacity: 1;
        }
        .toast-exit-active {
            transform: translateY(100%);
            opacity: 0;
            transition: all 300ms ease-in;
        }
    </style>
</head>
<body class="text-gray-800 antialiased min-h-screen flex flex-col items-center py-8 px-4">

    <div id="toast-container" class="fixed bottom-5 left-1/2 transform -translate-x-1/2 z-50 flex flex-col gap-2"></div>

    <div id="view-home" class="hidden flex-col items-center text-center max-w-md w-full mt-10">
        <h1 class="text-4xl font-extrabold text-blue-600 mb-6">Ruleta Interactiva</h1>
        <p class="text-gray-600 mb-8">Crea una ruleta personalizada, compártela con tus amigos y gírenla juntos en tiempo real.</p>
        <button id="btn-go-create" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-full shadow-lg transition-transform hover:scale-105 active:scale-95 text-lg w-full">
            Crear nueva ruleta
        </button>
    </div>

    <div id="view-create" class="hidden flex-col items-center w-full max-w-md bg-white rounded-2xl shadow-xl p-6">
        <h2 class="text-2xl font-bold mb-4 text-center">Configura tu Ruleta</h2>
        <p class="text-sm text-gray-500 mb-6 text-center">Agrega las opciones que aparecerán en la ruleta.</p>
        
        <div id="items-list" class="w-full flex flex-col gap-3 mb-6">
        </div>
        
        <button id="btn-add-item" class="text-blue-600 font-semibold mb-6 flex items-center justify-center gap-1 hover:text-blue-800 transition-colors w-full p-2 border-2 border-dashed border-blue-200 rounded-lg">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M10 5a1 1 0 011 1v3h3a1 1 0 110 2h-3v3a1 1 0 11-2 0v-3H6a1 1 0 110-2h3V6a1 1 0 011-1z" clip-rule="evenodd" />
            </svg>
            Agregar opción
        </button>
        
        <button id="btn-save-roulette" class="bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-8 rounded-full shadow-lg transition-transform hover:scale-105 active:scale-95 w-full text-lg">
            Guardar y Generar Enlace
        </button>
        <button id="btn-cancel-create" class="mt-4 text-gray-500 hover:text-gray-700 font-medium">Cancelar</button>
    </div>


    <div id="view-roulette" class="hidden flex-col items-center w-full max-w-lg">
        

        <div class="bg-white rounded-xl shadow-md p-4 w-full mb-6 flex flex-col sm:flex-row items-center gap-3">
            <div class="flex-1 w-full text-center sm:text-left">
                <p class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Enlace de invitación</p>
                <input type="text" id="share-url" readonly class="w-full text-sm bg-gray-50 border border-gray-200 rounded p-2 text-gray-700 outline-none">
            </div>
            <button id="btn-copy-url" class="bg-blue-100 text-blue-700 hover:bg-blue-200 font-semibold py-2 px-4 rounded-lg transition-colors w-full sm:w-auto flex items-center justify-center gap-2 mt-2 sm:mt-0">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path d="M8 3a1 1 0 011-1h2a1 1 0 110 2H9a1 1 0 01-1-1z" />
                    <path d="M6 3a2 2 0 00-2 2v11a2 2 0 002 2h8a2 2 0 002-2V5a2 2 0 00-2-2 3 3 0 01-3 3H9a3 3 0 01-3-3z" />
                </svg>
                Copiar
            </button>
        </div>


        <div class="relative w-full mb-8">
            <canvas id="roulette-canvas"></canvas>

            <div class="absolute top-0 left-1/2 transform -translate-x-1/2 -mt-4 z-10 pointer-events-none">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="#374151" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 22L2 2h20L12 22z" fill="#EF4444" stroke="#B91C1C" stroke-width="2" stroke-linejoin="round"/>
                </svg>
            </div>
        </div>

        <button id="btn-spin" class="bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-black text-2xl py-4 px-12 rounded-full shadow-[0_10px_20px_rgba(79,70,229,0.3)] transition-transform hover:scale-105 active:scale-95 w-full max-w-xs mb-8">
            ¡GIRAR!
        </button>


        <div class="bg-white rounded-xl shadow-md p-5 w-full mb-8">
            <h3 class="text-lg font-bold border-b pb-2 mb-3 flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-500" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-12a1 1 0 10-2 0v4a1 1 0 00.293.707l2.828 2.829a1 1 0 101.415-1.415L11 9.586V6z" clip-rule="evenodd" />
                </svg>
                Historial de resultados
            </h3>
            <ul id="history-list" class="space-y-2 max-h-60 overflow-y-auto">
                <li class="text-gray-400 text-center text-sm py-4 italic">Aún no hay giros.</li>
            </ul>
        </div>

        <button id="btn-new-roulette" class="text-gray-500 hover:text-gray-800 font-medium underline mb-10">
            Crear una nueva ruleta diferente
        </button>

    </div>
        <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDknd0CfKUmBj-E8sdH33YfT1qRk6KEz3o",
            authDomain: "ruleta-31446.firebaseapp.com",
            projectId: "ruleta-31446",
            storageBucket: "ruleta-31446.firebasestorage.app",
            messagingSenderId: "611436954573",
            appId: "1:611436954573:web:e3cdcd1e6f2943fa50fa84"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let items = ["🍕 Pizza", "🍔 Hamburguesa", "🍣 Sushi", "🌮 Tacos", "🥗 Ensalada"];
        let colors = ['#FF6B6B', '#4ECDC4', '#45B7D1', '#FDCB6E', '#6C5CE7', '#FFA62B', '#2ECC71'];
        
        let currentRouletteId = null;
        let unsubscribeSnapshot = null;
        let isInitiator = false;
        let currentUser = null;
        let currentRouletteData = {};
        
        let currentAngle = 0;
        let isSpinning = false;
        let spinTimeout = null;
        let spinAngleStart = 0;
        let spinTime = 0;
        let spinTimeTotal = 0;
        
        const canvas = document.getElementById('canvas');
        const ctx = canvas ? canvas.getContext('2d') : null;
        const spinBtn = document.getElementById('spin-btn');
        const itemInput = document.getElementById('item-input');
        const addBtn = document.getElementById('add-btn');
        const itemsList = document.getElementById('items-list');
        const saveShareBtn = document.getElementById('save-share-btn');
        const shareUrlInput = document.getElementById('share-url');
        const copyBtn = document.getElementById('copy-btn');
        const historyList = document.getElementById('history-list');

        signInAnonymously(auth).catch((error) => {
            console.error("Error en auth anónima:", error);
            showToast("Error de autenticación con Firebase", "error");
        });

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                checkUrlForId();
            } else {
                currentUser = null;
            }
        });

        function drawRoulette() {
            if (!ctx || !canvas) return;
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = Math.min(centerX, centerY) - 10;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (items.length === 0) {
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
                ctx.fillStyle = '#f3f4f6'; // Gris claro
                ctx.fill();
                ctx.stroke();
                ctx.fillStyle = '#374151';
                ctx.font = '20px Inter, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('Agrega opciones', centerX, centerY);
                return;
            }

            const arc = Math.PI * 2 / items.length;

            for (let i = 0; i < items.length; i++) {
                const angle = currentAngle + i * arc;
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, angle, angle + arc, false);
                ctx.lineTo(centerX, centerY);
                ctx.fillStyle = colors[i % colors.length];
                ctx.fill();
                ctx.save();
                ctx.strokeStyle = "rgba(255,255,255,0.5)";
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.restore();

                ctx.save();

                ctx.translate(centerX + Math.cos(angle + arc / 2) * radius * 0.7, 
                              centerY + Math.sin(angle + arc / 2) * radius * 0.7);
                ctx.rotate(angle + arc / 2 + Math.PI / 2);
                ctx.fillStyle = "#fff";
                ctx.font = 'bold 16px Inter, sans-serif';
                ctx.textAlign = 'center';
                ctx.shadowColor = 'rgba(0,0,0,0.5)';
                ctx.shadowBlur = 4;
                
                let text = items[i];
                if(text.length > 18) text = text.substring(0, 15) + '...';
                ctx.fillText(text, 0, 0);
                ctx.restore();
            }

            ctx.fillStyle = "#1F2937";
            ctx.beginPath();
            ctx.moveTo(centerX - 15, centerY - radius - 15);
            ctx.lineTo(centerX + 15, centerY - radius - 15);
            ctx.lineTo(centerX, centerY - radius + 15);
            ctx.fill();
        }

        function spin() {
            if (isSpinning || items.length === 0) return;
            
            const N = items.length;
            const targetIndex = Math.floor(Math.random() * N);
            
            if (currentRouletteId && isInitiator) {
                // Compartida y creador: Sincronizar con Firestore
                const docRef = doc(db, 'roulettes', currentRouletteId);
                updateDoc(docRef, {
                    spinTarget: targetIndex,
                    spinTimestamp: Date.now()
                }).catch(err => console.error("Error al sincronizar giro:", err));
            } else if (!currentRouletteId) {
                // Local: Girar inmediatamente
                startSpinAnimation(targetIndex);
            } else {
                showToast("Solo el creador puede girar esta ruleta compartida", "warning");
            }
        }

        function startSpinAnimation(targetIndex) {
            isSpinning = true;
            spinTime = 0;
            spinTimeTotal = 4000 + Math.random() * 1000;
            
            const arc = Math.PI * 2 / items.length;
            const targetAngle = (3 * Math.PI / 2) - (targetIndex * arc) - (arc / 2);
            const spins = 6 + Math.floor(Math.random() * 4); // Entre 6 y 9 vueltas extras
            
            const currentAngleMod = currentAngle % (Math.PI * 2);
            let angleDiff = targetAngle - currentAngleMod;
            if (angleDiff < 0) angleDiff += Math.PI * 2;
            
            spinAngleStart = (spins * Math.PI * 2) + angleDiff;
            
            rotateWheel();
        }

        function rotateWheel() {
            spinTime += 30;
            if (spinTime >= spinTimeTotal) {
                stopRotateWheel();
                return;
            }
            // Curva Ease-out (Desaceleración)
            const progress = spinTime / spinTimeTotal;
            const easeOut = 1 - Math.pow(1 - progress, 3.5);
            
            const angleStep = spinAngleStart * (1 - easeOut);
            currentAngle += (angleStep * 0.05);
            
            drawRoulette();
            spinTimeout = requestAnimationFrame(rotateWheel);
        }

        function stopRotateWheel() {
            cancelAnimationFrame(spinTimeout);
            isSpinning = false;
            
            // Determinar ganador según la posición final
            const arc = Math.PI * 2 / items.length;
            const degrees = currentAngle % (Math.PI * 2);
            let normalized = (3 * Math.PI / 2) - degrees;
            if (normalized < 0) normalized += Math.PI * 2;
            
            const index = Math.floor(normalized / arc);
            const winnerValue = items[index];
            
            showToast(`¡Salió: ${winnerValue}!`, 'success');
            
            // Guardar en el historial si somos creadores
            if (isInitiator && currentUser && currentRouletteId) {
                const docRef = doc(db, 'roulettes', currentRouletteId);
                const newHistory = [...(currentRouletteData.history || []), {
                    value: winnerValue,
                    timestamp: Date.now()
                }];
                updateDoc(docRef, { history: newHistory })
                    .catch(err => console.error("Error guardando historial:", err));
            }
        }

        async function saveAndShareRoulette() {
            if (items.length === 0) {
                showToast('Agrega opciones antes de compartir', 'warning');
                return;
            }
            if (!currentUser) {
                showToast('Aún conectando a la base de datos, intenta de nuevo...', 'warning');
                return;
            }
            
            try {
                const newId = Math.random().toString(36).substring(2, 9);
                const docRef = doc(db, 'roulettes', newId);
                
                const initialData = {
                    creatorId: currentUser.uid,
                    items: items,
                    history: [],
                    spinTarget: null,
                    spinTimestamp: null,
                    createdAt: Date.now()
                };
                
                await setDoc(docRef, initialData);
                
                isInitiator = true;
                currentRouletteId = newId;
                
                if (shareUrlInput) {
                    shareUrlInput.value = window.location.origin + window.location.pathname + '#' + newId;
                }
                
                showToast('¡Ruleta guardada! Comparte el enlace.', 'success');
                loadRoulette(newId);
                
            } catch (error) {
                console.error("Error al crear sesión compartida:", error);
                showToast('Hubo un error al generar el enlace', 'error');
            }
        }

        function loadRoulette(id) {
            if (unsubscribeSnapshot) unsubscribeSnapshot();
            
            const docRef = doc(db, 'roulettes', id);
            unsubscribeSnapshot = onSnapshot(docRef, (docSnap) => {
                if (docSnap.exists()) {
                    currentRouletteData = docSnap.data();
                    currentRouletteId = id;
                    
                    // Sincronizar opciones
                    if (currentRouletteData.items) {
                        items = currentRouletteData.items;
                        updateListUI();
                        if (!isSpinning) drawRoulette();
                    }
                    
                    isInitiator = (currentUser && currentRouletteData.creatorId === currentUser.uid);
                    
                    // Escuchar nuevo giro
                    if (currentRouletteData.spinTimestamp && currentRouletteData.spinTarget !== null && !isSpinning) {
                        const isRecent = (Date.now() - currentRouletteData.spinTimestamp) < 5000;
                        if (isRecent) {
                            startSpinAnimation(currentRouletteData.spinTarget);
                        }
                    }

                    // Sincronizar historial
                    updateHistoryUI(currentRouletteData.history || []);
                    
                } else {
                    showToast("Esa ruleta no existe o expiró.", "error");
                }
            });
        }

        function checkUrlForId() {
            const hash = window.location.hash;
            if (hash && hash.length > 1) {
                const id = hash.substring(1);
                loadRoulette(id);
                if (shareUrlInput) shareUrlInput.value = window.location.href;
            } else {
                updateListUI();
                drawRoulette();
            }
        }

        function updateListUI() {
            if (!itemsList) return;
            itemsList.innerHTML = '';
            items.forEach((item, index) => {
                const li = document.createElement('li');
                li.className = 'flex justify-between items-center bg-gray-50 p-3 rounded-lg border border-gray-100 mb-2 shadow-sm';
                
                const textSpan = document.createElement('span');
                textSpan.textContent = item;
                textSpan.className = 'font-medium text-gray-700 truncate';
                
                const deleteBtn = document.createElement('button');
                deleteBtn.innerHTML = '✕';
                deleteBtn.className = 'text-red-400 hover:text-red-600 transition-colors w-8 h-8 rounded-full hover:bg-red-50 flex items-center justify-center';
                
                deleteBtn.onclick = () => {
                    items.splice(index, 1);
                    updateListUI();
                    drawRoulette();
                    if (currentRouletteId && isInitiator) {
                        updateDoc(doc(db, 'roulettes', currentRouletteId), { items: items });
                    }
                };
                
                li.appendChild(textSpan);
                li.appendChild(deleteBtn);
                itemsList.appendChild(li);
            });
        }

        function updateHistoryUI(historyData) {
            if (!historyList) return;
            historyList.innerHTML = '';
            
            if (historyData.length === 0) {
                historyList.innerHTML = '<li class="text-gray-400 text-sm text-center py-4 italic">El historial está vacío</li>';
                return;
            }

            const reversed = [...historyData].reverse().slice(0, 10);
            reversed.forEach((record) => {
                const li = document.createElement('li');
                li.className = 'bg-white p-3 rounded-lg shadow-sm border-l-4 border-blue-500 mb-2 flex justify-between items-center';
                
                const valSpan = document.createElement('span');
                valSpan.className = 'font-bold text-gray-800';
                valSpan.textContent = record.value;
                
                const timeSpan = document.createElement('span');
                timeSpan.className = 'text-xs text-gray-400 font-medium';
                const date = new Date(record.timestamp);
                timeSpan.textContent = `${date.getHours().toString().padStart(2, '0')}:${date.getMinutes().toString().padStart(2, '0')}`;
                
                li.appendChild(valSpan);
                li.appendChild(timeSpan);
                historyList.appendChild(li);
            });
        }

        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            toast.className = `fixed bottom-6 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-full shadow-lg text-white font-bold transition-all duration-300 z-50 text-sm`;
            
            if (type === 'success') toast.classList.add('bg-green-500');
            else if (type === 'error') toast.classList.add('bg-red-500');
            else if (type === 'warning') toast.classList.add('bg-yellow-500', 'text-yellow-900');
            else toast.classList.add('bg-blue-500');
            
            toast.textContent = message;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translate(-50%, 100%)';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // --- Configuración de Eventos ---
        if (addBtn && itemInput) {
            addBtn.addEventListener('click', () => {
                const val = itemInput.value.trim();
                if (val) {
                    items.push(val);
                    itemInput.value = '';
                    updateListUI();
                    drawRoulette();
                    if (currentRouletteId && isInitiator) {
                        updateDoc(doc(db, 'roulettes', currentRouletteId), { items: items });
                    }
                }
            });
            itemInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') addBtn.click();
            });
        }

        if (spinBtn) {
            spinBtn.addEventListener('click', spin);
        }

        if (saveShareBtn) {
            saveShareBtn.addEventListener('click', saveAndShareRoulette);
        }

        if (copyBtn && shareUrlInput) {
            copyBtn.addEventListener('click', () => {
                if (!shareUrlInput.value) return;
                shareUrlInput.select();
                document.execCommand('copy');
                showToast('¡Enlace copiado al portapapeles!', 'success');
            });
        }

        // Iniciar pintando el canvas vacío
        if (canvas) {
            drawRoulette();
            updateListUI();
        }
    </script>
</body>
</html>
