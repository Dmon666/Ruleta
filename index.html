<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruleta Compartida</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f3f4f6;
            touch-action: manipulation;
        }
        
        #roulette-canvas {
            width: 100%;
            max-width: 400px;
            aspect-ratio: 1;
            margin: 0 auto;
            display: block;
            touch-action: none; 
            cursor: pointer;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.1));
            transition: transform 0.2s;
        }
        
        #roulette-canvas:active {
            transform: scale(0.98);
        }

        .toast-enter {
            transform: translateY(100%);
            opacity: 0;
        }
        .toast-enter-active {
            transform: translateY(0);
            opacity: 1;
            transition: all 300ms ease-out;
        }
        .toast-exit {
            transform: translateY(0);
            opacity: 1;
        }
        .toast-exit-active {
            transform: translateY(100%);
            opacity: 0;
            transition: all 300ms ease-in;
        }
    </style>
</head>
<body class="text-gray-800 antialiased min-h-screen flex flex-col items-center py-8 px-4">

    <div id="toast-container" class="fixed bottom-5 left-1/2 transform -translate-x-1/2 z-50 flex flex-col gap-2"></div>

    <div id="view-home" class="hidden flex-col items-center text-center max-w-md w-full mt-10">
        <h1 class="text-4xl font-extrabold text-blue-600 mb-6">Ruleta Interactiva</h1>
        <p class="text-gray-600 mb-8">Crea una ruleta personalizada, compártela con tus amigos y gírenla juntos en tiempo real.</p>
        <button id="btn-go-create" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-full shadow-lg transition-transform hover:scale-105 active:scale-95 text-lg w-full">
            Crear nueva ruleta
        </button>
    </div>

    <div id="view-create" class="hidden flex-col items-center w-full max-w-md bg-white rounded-2xl shadow-xl p-6">
        <h2 class="text-2xl font-bold mb-4 text-center">Configura tu Ruleta</h2>
        <p class="text-sm text-gray-500 mb-6 text-center">Agrega las opciones que aparecerán en la ruleta.</p>
        
        <div id="items-list" class="w-full flex flex-col gap-3 mb-6">
        </div>
        
        <button id="btn-add-item" class="text-blue-600 font-semibold mb-6 flex items-center justify-center gap-1 hover:text-blue-800 transition-colors w-full p-2 border-2 border-dashed border-blue-200 rounded-lg">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M10 5a1 1 0 011 1v3h3a1 1 0 110 2h-3v3a1 1 0 11-2 0v-3H6a1 1 0 110-2h3V6a1 1 0 011-1z" clip-rule="evenodd" />
            </svg>
            Agregar opción
        </button>
        
        <button id="btn-save-roulette" class="bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-8 rounded-full shadow-lg transition-transform hover:scale-105 active:scale-95 w-full text-lg">
            Guardar y Generar Enlace
        </button>
        <button id="btn-cancel-create" class="mt-4 text-gray-500 hover:text-gray-700 font-medium">Cancelar</button>
    </div>


    <div id="view-roulette" class="hidden flex-col items-center w-full max-w-lg">
        

        <div class="bg-white rounded-xl shadow-md p-4 w-full mb-6 flex flex-col sm:flex-row items-center gap-3">
            <div class="flex-1 w-full text-center sm:text-left">
                <p class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Enlace de invitación</p>
                <input type="text" id="share-url" readonly class="w-full text-sm bg-gray-50 border border-gray-200 rounded p-2 text-gray-700 outline-none">
            </div>
            <button id="btn-copy-url" class="bg-blue-100 text-blue-700 hover:bg-blue-200 font-semibold py-2 px-4 rounded-lg transition-colors w-full sm:w-auto flex items-center justify-center gap-2 mt-2 sm:mt-0">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path d="M8 3a1 1 0 011-1h2a1 1 0 110 2H9a1 1 0 01-1-1z" />
                    <path d="M6 3a2 2 0 00-2 2v11a2 2 0 002 2h8a2 2 0 002-2V5a2 2 0 00-2-2 3 3 0 01-3 3H9a3 3 0 01-3-3z" />
                </svg>
                Copiar
            </button>
        </div>


        <div class="relative w-full mb-8">
            <canvas id="roulette-canvas"></canvas>

            <div class="absolute top-0 left-1/2 transform -translate-x-1/2 -mt-4 z-10 pointer-events-none">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="#374151" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 22L2 2h20L12 22z" fill="#EF4444" stroke="#B91C1C" stroke-width="2" stroke-linejoin="round"/>
                </svg>
            </div>
        </div>

        <button id="btn-spin" class="bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-black text-2xl py-4 px-12 rounded-full shadow-[0_10px_20px_rgba(79,70,229,0.3)] transition-transform hover:scale-105 active:scale-95 w-full max-w-xs mb-8">
            ¡GIRAR!
        </button>


        <div class="bg-white rounded-xl shadow-md p-5 w-full mb-8">
            <h3 class="text-lg font-bold border-b pb-2 mb-3 flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-500" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-12a1 1 0 10-2 0v4a1 1 0 00.293.707l2.828 2.829a1 1 0 101.415-1.415L11 9.586V6z" clip-rule="evenodd" />
                </svg>
                Historial de resultados
            </h3>
            <ul id="history-list" class="space-y-2 max-h-60 overflow-y-auto">
                <li class="text-gray-400 text-center text-sm py-4 italic">Aún no hay giros.</li>
            </ul>
        </div>

        <button id="btn-new-roulette" class="text-gray-500 hover:text-gray-800 font-medium underline mb-10">
            Crear una nueva ruleta diferente
        </button>

    </div>


    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, updateDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";


        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        
        let app, auth, db, currentUser;
        

        let currentRouletteData = null;
        let currentRouletteId = null;
        let unsubscribeSnapshot = null;
        

        let currentRotation = 0;
        let isSpinning = false;
        let animationFrameId = null;
        let localLastSpinTime = 0; 


        const PALETTE = ['#FF595E', '#FFCA3A', '#8AC926', '#1982C4', '#6A4C93', '#F56476', '#E0FF4F', '#084C61', '#F8961E', '#43AA8B'];

  
        const views = {
            home: document.getElementById('view-home'),
            create: document.getElementById('view-create'),
            roulette: document.getElementById('view-roulette')
        };
        const canvas = document.getElementById('roulette-canvas');
        const ctx = canvas.getContext('2d');
        const itemsListDiv = document.getElementById('items-list');
        const historyListDiv = document.getElementById('history-list');

        async function init() {
            try {
                app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);


                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }

                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        currentUser = user;
                        handleRouting(); 
                    }
                });
            } catch (error) {
                console.error("Error al inicializar Firebase:", error);
                showToast("Hubo un error de conexión.", "error");
            }
            
            setupEventListeners();
        }


        function handleRouting() {
            const hash = window.location.hash.substring(1);
            if (hash && hash !== 'crear') {
                loadRoulette(hash);
            } else if (hash === 'crear') {
                showView('create');
                setupCreateForm();
            } else {
                showView('home');
            }
        }

        window.addEventListener('hashchange', handleRouting);

        function showView(viewName) {
            Object.values(views).forEach(v => v.classList.add('hidden'));
            views[viewName].classList.remove('hidden');
            views[viewName].classList.add('flex');
            
            if (viewName === 'roulette') {
                resizeCanvas();
            }
        }


        function showToast(message, type = 'info') {
            const toastContainer = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const colors = type === 'error' ? 'bg-red-500' : (type === 'success' ? 'bg-green-500' : 'bg-gray-800');
            toast.className = `${colors} text-white px-6 py-3 rounded-xl shadow-lg font-medium text-sm toast-enter toast-enter-active`;
            toast.textContent = message;
            toastContainer.appendChild(toast);

            setTimeout(() => {
                toast.classList.replace('toast-enter-active', 'toast-exit-active');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }


        function setupCreateForm() {
            itemsListDiv.innerHTML = '';
            addInputItem('Opción 1');
            addInputItem('Opción 2');
            addInputItem('Opción 3');
        }

        function addInputItem(value = '') {
            const div = document.createElement('div');
            div.className = 'flex gap-2 w-full';
            div.innerHTML = `
                <input type="text" value="${value}" placeholder="Ej. Tacos" class="flex-1 bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5 outline-none item-input">
                <button type="button" class="btn-remove-item text-red-500 hover:bg-red-50 p-2.5 rounded-lg transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" />
                    </svg>
                </button>
            `;
            
            div.querySelector('.btn-remove-item').addEventListener('click', () => {
                if (document.querySelectorAll('.item-input').length > 2) {
                    div.remove();
                } else {
                    showToast('La ruleta debe tener al menos 2 opciones.', 'error');
                }
            });
            
            itemsListDiv.appendChild(div);
            div.querySelector('input').focus();
        }

        async function saveAndShareRoulette() {
            if (!currentUser) return;

            const inputs = document.querySelectorAll('.item-input');
            const items = Array.from(inputs).map(inp => inp.value.trim()).filter(val => val !== '');
            
            if (items.length < 2) {
                showToast('Ingresa al menos 2 opciones válidas.', 'error');
                return;
            }


            const colors = items.map((_, i) => PALETTE[i % PALETTE.length]);
            
  
            const newId = Math.random().toString(36).substring(2, 9);
            
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'roulettes', newId);
            
            const initialData = {
                items: items,
                colors: colors,
                history: [],
                lastSpin: null
            };

            try {
                const btn = document.getElementById('btn-save-roulette');
                btn.disabled = true;
                btn.textContent = "Guardando...";
                
                await setDoc(docRef, initialData);
                

                window.location.hash = newId;
                showToast('¡Ruleta creada exitosamente!', 'success');
                
            } catch (error) {
                console.error("Error al guardar:", error);
                showToast('Error al crear la ruleta.', 'error');
            } finally {
                const btn = document.getElementById('btn-save-roulette');
                btn.disabled = false;
                btn.textContent = "Guardar y Generar Enlace";
            }
        }


        function loadRoulette(id) {
            if (!currentUser) return;
            
            currentRouletteId = id;
            showView('roulette');
            
            const shareInput = document.getElementById('share-url');
            shareInput.value = window.location.origin + window.location.pathname + '#' + id;

            if (unsubscribeSnapshot) unsubscribeSnapshot();

            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'roulettes', id);
            
            unsubscribeSnapshot = onSnapshot(docRef, (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    currentRouletteData = data;
                    
                    updateHistoryUI(data.history);

                    if (!isSpinning) {
                        drawWheel();
                    }

                    if (data.lastSpin && data.lastSpin.timestamp > localLastSpinTime) {
                        const targetIndex = data.lastSpin.targetIndex;
                        const isMe = data.lastSpin.spinnerId === currentUser.uid;
                        
                        startSpinAnimation(targetIndex, isMe);
                    }
                } else {
                    showToast('Ruleta no encontrada.', 'error');
                    window.location.hash = '';
                }
            }, (error) => {
                console.error("Error al escuchar cambios:", error);
            });
        }


        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();

            const dpr = window.devicePixelRatio || 1;
            canvas.width = rect.width * dpr;
            canvas.height = rect.width * dpr; 
            ctx.scale(dpr, dpr);
            
            canvas.style.width = '100%';
            canvas.style.height = '100%';
            
            if (currentRouletteData && !isSpinning) {
                drawWheel();
            }
        }

        function drawWheel() {
            if (!currentRouletteData || !currentRouletteData.items) return;
            
            const { items, colors } = currentRouletteData;
            const N = items.length;
            const sliceAngle = (2 * Math.PI) / N;
            

            const width = canvas.width / (window.devicePixelRatio || 1);
            const height = canvas.height / (window.devicePixelRatio || 1);
            const cx = width / 2;
            const cy = height / 2;
            const radius = Math.min(cx, cy) - 5; 
            
            ctx.clearRect(0, 0, width, height);
            
            for (let i = 0; i < N; i++) {
                const startAngle = currentRotation + i * sliceAngle;
                const endAngle = startAngle + sliceAngle;
                

                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.arc(cx, cy, radius, startAngle, endAngle);
                ctx.closePath();
                ctx.fillStyle = colors[i % colors.length];
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#ffffff';
                ctx.stroke();
                
   
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(startAngle + sliceAngle / 2);
                ctx.textAlign = 'right';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold ' + Math.max(12, 20 - (N/2)) + 'px sans-serif';
                
   
                ctx.shadowColor = 'rgba(0,0,0,0.5)';
                ctx.shadowBlur = 4;
                ctx.shadowOffsetX = 1;
                ctx.shadowOffsetY = 1;


                let text = items[i];
                if (text.length > 15) text = text.substring(0, 13) + '...';
                
                ctx.fillText(text, radius - 20, 0);
                ctx.restore();
            }
            

            ctx.beginPath();
            ctx.arc(cx, cy, radius * 0.15, 0, 2 * Math.PI);
            ctx.fillStyle = '#ffffff';
            ctx.fill();
            ctx.lineWidth = 4;
            ctx.strokeStyle = '#e5e7eb';
            ctx.stroke();
        }


        async function triggerSpin() {
            if (isSpinning || !currentRouletteData || !currentUser) return;
            
            const items = currentRouletteData.items;
            const N = items.length;
            
       
            const targetIndex = Math.floor(Math.random() * N);
            

            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'roulettes', currentRouletteId);
            const now = Date.now();
            
            try {
  
                await updateDoc(docRef, {
                    lastSpin: {
                        targetIndex: targetIndex,
                        timestamp: now,
                        spinnerId: currentUser.uid
                    }
                });
            } catch (error) {
                console.error("Error al iniciar el giro:", error);
                showToast("Hubo un error al girar.", "error");
            }
        }

        function easeOutCubic(t) {
            return 1 - Math.pow(1 - t, 3);
        }

        function startSpinAnimation(targetIndex, isInitiator) {
            if (isSpinning) return;
            isSpinning = true;
            localLastSpinTime = Date.now();
            
            const N = currentRouletteData.items.length;
            const sliceAngle = (2 * Math.PI) / N;
            const targetCenterAngleBase = (targetIndex + 0.5) * sliceAngle;
            const finalAngleBase = -Math.PI / 2 - targetCenterAngleBase;
            const currentRotNormalized = currentRotation % (2 * Math.PI);
            let angleDiff = finalAngleBase - currentRotNormalized;
            while (angleDiff < 0) {
                angleDiff += 2 * Math.PI;
            }
            
            const totalRotationNeeded = angleDiff + (5 * 2 * Math.PI);
            
            const startRotation = currentRotation;
            const duration = 5000; 
            const startTime = performance.now();
            
            function animate(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                
                const easeProgress = easeOutCubic(progress);
                currentRotation = startRotation + totalRotationNeeded * easeProgress;
                
                drawWheel();
                
                if (progress < 1) {
                    animationFrameId = requestAnimationFrame(animate);
                } else {
                    finishSpin(targetIndex, isInitiator);
                }
            }
            
            animationFrameId = requestAnimationFrame(animate);
        }

        async function finishSpin(targetIndex, isInitiator) {
            isSpinning = false;
            const winnerValue = currentRouletteData.items[targetIndex];
            showToast(`¡Salió: ${winnerValue}!`, 'success');
            if (isInitiator && currentUser && currentRouletteId) {
                try {
                    const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'roulettes', currentRouletteId);
                    const newHistory = [...(currentRouletteData.history || []), {
                        value: winnerValue,
                        time: Date.now()
                    }];
                    
                    await updateDoc(docRef, { history: newHistory });
                } catch (error) {
                    console.error("Error al guardar historial:", error);
                }
            }
        }

        function updateHistoryUI(historyArray) {
            historyListDiv.innerHTML = '';
            
            if (!historyArray || historyArray.length === 0) {
                historyListDiv.innerHTML = '<li class="text-gray-400 text-center text-sm py-4 italic">Aún no hay giros.</li>';
                return;
            }
            
            const sortedHistory = [...historyArray].sort((a, b) => b.time - a.time);
            
            sortedHistory.forEach((item, index) => {
                const li = document.createElement('li');
                li.className = `flex justify-between items-center p-3 rounded-lg ${index === 0 ? 'bg-green-50 border border-green-200' : 'bg-gray-50'}`;
                
                const date = new Date(item.time);
                const timeString = date.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'});
                
                li.innerHTML = `
                    <span class="font-bold ${index === 0 ? 'text-green-700' : 'text-gray-700'}">${item.value}</span>
                    <span class="text-xs text-gray-500">${timeString}</span>
                `;
                historyListDiv.appendChild(li);
            });
        }

        function setupEventListeners() {
            document.getElementById('btn-go-create').addEventListener('click', () => {
                window.location.hash = 'crear';
            });

            document.getElementById('btn-add-item').addEventListener('click', () => addInputItem());
            document.getElementById('btn-save-roulette').addEventListener('click', saveAndShareRoulette);
            document.getElementById('btn-cancel-create').addEventListener('click', () => {
                window.location.hash = '';
            });

            document.getElementById('btn-copy-url').addEventListener('click', () => {
                const input = document.getElementById('share-url');
                if (navigator.clipboard && window.isSecureContext) {
                    navigator.clipboard.writeText(input.value).then(() => {
                        showToast('¡Enlace copiado al portapapeles!', 'success');
                    }).catch(err => copyFallback(input));
                } else {
                    copyFallback(input);
                }
            });

            document.getElementById('btn-new-roulette').addEventListener('click', () => {
                window.location.hash = '';
            });

            document.getElementById('btn-spin').addEventListener('click', triggerSpin);
            canvas.addEventListener('click', triggerSpin);
            canvas.addEventListener('touchstart', (e) => {
                e.preventDefault(); 
                triggerSpin();
            }, { passive: false });

            window.addEventListener('resize', () => {
                if (!views.roulette.classList.contains('hidden')) {
                    resizeCanvas();
                }
            });
        }

        function copyFallback(inputElement) {
            inputElement.select();
            inputElement.setSelectionRange(0, 99999); 
            try {
                document.execCommand('copy');
                showToast('¡Enlace copiado al portapapeles!', 'success');
            } catch (err) {
                showToast('No se pudo copiar automáticamente.', 'error');
            }
            window.getSelection().removeAllRanges();
        }

        document.addEventListener('DOMContentLoaded', init);

    </script>
</body>
</html>
